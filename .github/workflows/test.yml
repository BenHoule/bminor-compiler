name: Compiler tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-14 flex bison valgrind
      - run: make -j2 test
      - run: make valgrind
      - run: make analyze
      - run: make sanitize
